[project]
name = "clipforge"
version = "0.1.0"
description = "Local AI shorts generator: Whisper + Gemma (Ollama) + FFmpeg"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042", "B008"]  # B008: FastAPI File()/Form() defaults are idiomatic
