name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Real-ffmpeg render tests and the caption-font test skip themselves without these — install them so they run.
      - name: System packages (ffmpeg with libass, fontconfig, DejaVu fonts)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg fontconfig fonts-dejavu-core

      - name: Tool versions
        run: ffmpeg -hide_banner -version | head -1 && fc-match Arial && python --version

      - name: Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests tts

      # No GPU or Ollama needed: LLM calls go through FakeLLM and heavy imports (faster_whisper, yt_dlp) are lazy.
      - name: Tests
        run: python -m pytest -q -rs

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
